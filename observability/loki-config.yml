# Minimal single-instance Loki config — filesystem storage, no auth (the
# whole point here is a self-hosted stack reachable only inside the
# docker-compose network, not exposed to the internet — see
# docker-compose.observability.yml, which does not publish Loki's port).
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: false
