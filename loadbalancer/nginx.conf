worker_processes auto;

events {
  worker_connections 1024;
}

http {
  upstream youthchain_backend {
    server backend1:5000;
    server backend2:5000;
    server backend3:5000;
  }

  # Real gap found via a full engineering audit: nginx's compiled-in
  # default access log format is "combined", which logs $request verbatim
  # -- e.g. "GET /application_file/foo.pdf?token=eyJhbGci... HTTP/1.1".
  # backend/app.py deliberately accepts a JWT via ?token= (see its own
  # JWT_TOKEN_LOCATION comment) for the two file-download routes that
  # url_launcher opens in an external app/browser, which can't attach a
  # custom Authorization header -- but that config is global to every
  # @jwt_required() route, and the token it accepts is the SAME
  # full-privilege bearer token used everywhere else in the API, not
  # something scoped to "just this file" the way that comment's own
  # "not a wider credential" framing implies. Nothing else in this stack
  # was logging it (gunicorn has no --access-logfile flag, and neither
  # Caddyfile/Caddyfile.scale has a `log` directive) -- this was the one
  # place in the request path, on the horizontal-scale deployment
  # specifically, that would have written every such token to disk in
  # plaintext by default, with a real chance of it then reaching the
  # observability stack's own log aggregation (Loki/Promtail) and
  # becoming queryable by anyone with Grafana access, not just someone
  # with shell access to this box. $uri (path only, no query string) in
  # place of $request closes that off without disabling access logging
  # altogether, which has real operational value on its own.
  log_format scoped '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $uri $server_protocol" $status '
                     '$body_bytes_sent "$http_referer" "$http_user_agent"';

  # Standard conditional-Upgrade pattern: only actually set
  # `Connection: upgrade` on real WebSocket upgrade requests (Socket.IO's
  # websocket transport) — setting it unconditionally on every plain HTTP
  # request would break connection keep-alive for everything else.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # TLS is terminated in front of this container by the `caddy` service in
  # docker-compose.scale.yml (see Caddyfile.scale) — nginx itself only
  # ever speaks plain HTTP, on purpose, so it has no certificates of its
  # own to manage. That means $scheme here is always "http" and must NOT
  # be trusted as the real client-facing protocol: this used to hardcode
  # `X-Forwarded-Proto $scheme`, which silently overwrote the real
  # "https" Caddy had already set, made Flask's ProxyFix see
  # request.is_secure() == False, and dropped every Secure-flagged
  # session cookie (employer/portal login) even though the edge really
  # was on HTTPS. Pass through whatever the upstream proxy already set;
  # only fall back to nginx's own $scheme when nothing reached it (i.e.
  # nginx was hit directly — local/dev testing on :8080, no TLS in that
  # path either, so $scheme is honest there).
  map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
  }

  server {
    listen 80;
    access_log /var/log/nginx/access.log scoped;

    location / {
      proxy_pass http://youthchain_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 120s;
    }
  }
}
