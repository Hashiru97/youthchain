worker_processes auto;

events {
  worker_connections 1024;
}

http {
  upstream youthchain_backend {
    server backend1:5000;
    server backend2:5000;
    server backend3:5000;
  }

  # Standard conditional-Upgrade pattern: only actually set
  # `Connection: upgrade` on real WebSocket upgrade requests (Socket.IO's
  # websocket transport) — setting it unconditionally on every plain HTTP
  # request would break connection keep-alive for everything else.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://youthchain_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 120s;
    }
  }
}
