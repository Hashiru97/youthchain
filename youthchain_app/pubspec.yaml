name: youthchain_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.8.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # Krio-friendly copy (see lib/l10n/) -- flutter_localizations is the SDK
  # package that wires generated AppLocalizations into MaterialApp's
  # localizationsDelegates; intl is what the generated code itself is
  # built on (date/number formatting plumbing even though these .arb
  # files are currently plain strings, no plurals/dates yet).
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  file_selector: ^1.0.3
  url_launcher: ^6.3.0
  # socket_io_client, firebase_core, and firebase_messaging were all
  # major-version stale as of the last engineering audit and are now
  # current -- each bumped individually, one at a time, and verified
  # with flutter analyze + flutter test + a real `flutter build apk`
  # (the only class of break these particular bumps produce -- compile-
  # time Gradle/AndroidX version conflicts -- that analyze/test alone
  # never catch). All three passed clean.
  socket_io_client: ^3.0.0
  # Deliberately NOT bumped past 9.x, unlike its siblings above --
  # attempted (11.0.0), and it genuinely can't go in cleanly: real
  # `flutter build apk` failure, not a doubt --
  # flutter_secure_storage 11.0.0 requires compileSdk = 37, and this
  # project is pinned to compileSdk 36 (see android/app/build.gradle.kts)
  # -- a project-level setting, not just this one environment's Android
  # SDK install. Bumping compileSdk (and, separately, verifying AGP
  # still supports it) is its own deliberate, tested change -- not
  # something to bundle silently into a routine dependency refresh for
  # the package that stores this app's own auth token.
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.0
  # Deliberately NOT bumped past 6.x -- attempted (7.0.0), and it hits
  # the exact same wall the engineering audit already found and pinned
  # around for url_launcher_android (see the dependency_overrides block
  # below): connectivity_plus_android's own AndroidX transitives need
  # Android Gradle Plugin 8.9.1+, this project is pinned to AGP 8.7.3.
  # Confirmed via a real `flutter build apk` failure, not assumed. The
  # real fix for this one AND flutter_secure_storage above is the same
  # single AGP bump -- worth doing as its own tested change once, not
  # chasing package-by-package.
  connectivity_plus: ^6.0.0
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter_html: ^3.0.0
  printing: ^5.14.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.0
  plugin_platform_interface: ^2.1.0

# Real gap found via a full engineering audit: a routine `flutter pub
# upgrade` (no --major-versions, entirely within the constraints above)
# silently breaks the Android build -- confirmed live with a real
# `flutter build apk`, not assumed. url_launcher (^6.3.0 above) has no
# upper bound on its own transitive url_launcher_android dependency, and
# the newest one pub resolves to (6.3.30, pulling in androidx.core
# 1.17.0 / androidx.browser 1.9.0) requires Android Gradle Plugin 8.9.1+
# -- this project is pinned to AGP 8.7.3 (see android/settings.gradle.kts),
# a full major version behind that. Pinned here at the last version
# confirmed to actually build (6.3.20) so a future routine dependency
# refresh doesn't silently reintroduce this. Removing this override is
# safe again once AGP itself is deliberately bumped to 8.9.1+ (its own,
# separately-tested change -- not bundled into a routine `pub upgrade`).
dependency_overrides:
  url_launcher_android: 6.3.20

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# Source images + per-platform output config for `dart run flutter_launcher_icons`.
# Regenerate after changing the brand icon by re-running that command — it
# overwrites every android/mipmap-*/ic_launcher*.png and every
# ios/Runner/Assets.xcassets/AppIcon.appiconset/*.png from these two sources.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#F5F3EE"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # Generates AppLocalizations from lib/l10n/*.arb at build time (see
  # l10n.yaml) into .dart_tool/, which is gitignored -- regenerated by
  # `flutter pub get`/`flutter gen-l10n`, never hand-edited or committed.
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/img/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
