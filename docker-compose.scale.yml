# Horizontal-scaling stack: nginx load balancer + 3 backend replicas +
# Postgres + Redis. Self-contained (like docker-compose.tls.yml) rather
# than additive, since it changes the backend topology fundamentally (one
# instance -> three named instances, SQLite -> Postgres, in-memory rate
# limiting -> Redis) rather than adding independent services alongside the
# base stack.
#
# This is only honestly possible because of two things built earlier this
# session: stateless JWT auth (no server-side session to keep sticky to one
# instance) and Redis-backed OTP rate limiting (a shared store, so the
# limiter is correct across replicas instead of each instance granting its
# own separate attempt budget). Before those, "horizontal scaling" would
# have been a compose file that started multiple processes with silently
# broken security properties, not a real scaling story.
#
# Usage (local/dev, no TLS):
#   docker compose -f docker-compose.scale.yml up -d --build
#   curl http://localhost:8080/healthz   # via nginx directly, not a caddy/TLS path
#
# Usage (production, real domain with DNS already pointed at this host):
#   1. Edit Caddyfile.scale: replace "your-domain.example" with your real domain.
#   2. docker compose -f docker-compose.scale.yml --profile production up -d --build
#   Caddy (the `caddy` service, gated behind the `production` profile so it
#   never starts for plain local/dev use) terminates TLS the same way
#   docker-compose.tls.yml's does, then fronts nginx instead of a single
#   backend instance.
#
# Two real bugs found and fixed getting this to actually work, not
# guessed: (1) plain `depends_on: [postgres]` only waits for the container
# to start, not for Postgres to be ready to accept connections — all three
# backends raced to connect before it was up and crashed; fixed with a
# real `pg_isready` healthcheck + `condition: service_healthy`.
# (2) all three replicas running `flask db upgrade` concurrently in their
# own entrypoints raced to CREATE TABLE alembic_version, and the losers
# crashed with a real Postgres UniqueViolation — the crash-loop happened
# to self-heal via Docker's restart policy, which is not the same as a
# fix. Fixed with a dedicated one-shot `migrate` service that runs the
# migration exactly once; backend1/2/3 wait for it to fully complete
# before starting (their own startup `flask db upgrade` then runs against
# an already-current schema and is a correct no-op, not a second race).
#
# Live-verified this session (see docs/load-testing.md for exact numbers):
# real requests round-robin across all three replicas, and a rate-limit
# check tripped via one replica is correctly seen by the others (Redis
# shared state, not per-process).
#
# THIRD REAL GAP, FOUND AND NOW CLOSED -- this stack sets
# FLASK_ENV=production on every backend, which makes app.py mark the
# session cookie Secure, so it needs a real TLS-terminating edge in front
# or every session-cookie login (employer, job-seeker portal) silently
# fails to persist. Fixing this inside nginx.conf itself would mean
# hand-rolling certificate provisioning/renewal (certbot + a cron job)
# nginx has no built-in machinery for — instead this stack reuses the
# already-built, already-verified Caddy edge from docker-compose.tls.yml:
# the `caddy` service below terminates TLS with automatic Let's Encrypt
# certs and reverse-proxies to nginx, which keeps doing exactly what it
# already did (round-robin across backend1/2/3). The half of this bug that
# was actually inside nginx.conf -- it unconditionally overwrote
# X-Forwarded-Proto with its own always-"http" $scheme, silently
# discarding whatever a real upstream terminator had already set -- is
# fixed there directly (see nginx.conf's own comment on
# $proxy_x_forwarded_proto). DO NOT expose the plain :8080 nginx port
# (below) to real users; only the `caddy` service is meant to be
# internet-facing.

services:
  postgres:
    # Custom pg_cron-enabled image — see infra/postgres-cron/Dockerfile
    # and docker-compose.yml's postgres service for why this can no
    # longer be stock postgres:16-alpine.
    build: ./infra/postgres-cron
    command: postgres -c shared_preload_libraries=pg_cron -c cron.database_name=youthchain
    environment:
      - POSTGRES_PASSWORD=youthchain
      - POSTGRES_DB=youthchain
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot: applies migrations exactly once, then exits. backend1/2/3
  # wait for this to fully succeed before starting, so their own startup
  # `flask db upgrade` (unchanged, same entrypoint as every other compose
  # file) runs against an already-current schema instead of racing.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:youthchain@postgres:5432/youthchain
    command: ["true"]
    depends_on:
      postgres:
        condition: service_healthy

  backend1:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:youthchain@postgres:5432/youthchain
      - REDIS_URL=redis://redis:6379/0
      - FLASK_ENV=production
      # Safe across all three replicas × their gunicorn workers — the
      # claim query (scanner/poller.py) uses Postgres FOR UPDATE SKIP
      # LOCKED specifically so every one of them can run this loop with
      # zero risk of double-claiming the same scan.
      - ENABLE_JOB_SCANNER_POLLER=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads-data:/app/uploads
      - backups-data:/app/backups
    restart: unless-stopped

  backend2:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:youthchain@postgres:5432/youthchain
      - REDIS_URL=redis://redis:6379/0
      - FLASK_ENV=production
      # Safe across all three replicas × their gunicorn workers — the
      # claim query (scanner/poller.py) uses Postgres FOR UPDATE SKIP
      # LOCKED specifically so every one of them can run this loop with
      # zero risk of double-claiming the same scan.
      - ENABLE_JOB_SCANNER_POLLER=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads-data:/app/uploads
      - backups-data:/app/backups
    restart: unless-stopped

  backend3:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:youthchain@postgres:5432/youthchain
      - REDIS_URL=redis://redis:6379/0
      - FLASK_ENV=production
      # Safe across all three replicas × their gunicorn workers — the
      # claim query (scanner/poller.py) uses Postgres FOR UPDATE SKIP
      # LOCKED specifically so every one of them can run this loop with
      # zero risk of double-claiming the same scan.
      - ENABLE_JOB_SCANNER_POLLER=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads-data:/app/uploads
      - backups-data:/app/backups
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./loadbalancer/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend1
      - backend2
      - backend3
    restart: unless-stopped

  # TLS-terminating edge for production use — see this file's header
  # comment. Gated behind the `production` profile so a plain `docker
  # compose -f docker-compose.scale.yml up` (local/dev, no real domain)
  # never tries to start it: Caddy would otherwise sit there failing to
  # get a certificate for the placeholder domain in Caddyfile.scale.
  caddy:
    image: caddy:2-alpine
    profiles: ["production"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.scale:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  postgres-data:
  uploads-data:
  backups-data:
  caddy-data:
  caddy-config:
