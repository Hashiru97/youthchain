name: CI

# Runs lint/tests on every push and PR (BL-13 / Phase 3 #12). Before this
# existed, nothing verified changes before they reached `main` — which is
# exactly how the two compile-breaking bugs fixed under BL-01 shipped to
# the committed codebase undetected in the first place.
#
# Every `uses:` below is pinned to a full commit SHA, not a mutable tag
# like `@v4` — real gap found via a full OWASP Top 10 (A08: Software and
# Data Integrity Failures) review: a tag can be moved by the action's
# maintainer (or an attacker who compromises that maintainer's account)
# to point at different code while the version number stays the same,
# and this pipeline would silently pull it on the next run — exactly the
# mechanism behind real supply-chain compromises of popular Actions.
# Each SHA is the real commit actions/checkout@v4, actions/setup-python@v5,
# actions/setup-node@v4, and subosito/flutter-action@v2 resolved to at the
# time this was written (via `gh api repos/<owner>/<repo>/git/refs/tags/<tag>`,
# not guessed) — the trailing `# vX.Y.Z` comment on each is for a human
# reading this file, not something GitHub Actions itself interprets.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Defense-in-depth alongside the SHA-pinning above: this pipeline only
# ever builds/tests, it never pushes, comments, or writes anything, so it
# never needs more than read access to the repo. Without this block every
# job would run with the org/repo's default GITHUB_TOKEN permissions,
# which can be broader than that.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (Flask) — lint & tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Matrixed across both database engines this app actually supports —
    # real gap found and fixed alongside the Postgres-by-default
    # deployment change: this job previously only ever ran against SQLite
    # (conftest.py hardcoded DATABASE_URL, silently overriding anything a
    # CI job env set), so the Postgres-specific search code path
    # (api_search_jobs' `elif dialect == "postgresql":` branch) and every
    # Alembic migration had never once been verified in CI against the
    # database engine production actually runs on — only manually, during
    # the load-testing session. fail-fast: false so a Postgres-only
    # failure doesn't hide/cancel the SQLite leg's own result or vice versa.
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: sqlite
            database_url: ""
          - database: postgres
            database_url: "postgresql://postgres:postgres@localhost:5432/youthchain_test"
    # Redis: runs the suite against a real instance, not just the
    # in-memory OTP-rate-limit fallback — the fallback path is still
    # exercised by every developer's local run (no REDIS_URL set there),
    # so this is the one place the real shared-store path gets
    # continuously verified. Postgres: only actually used by the
    # `postgres` matrix leg (DATABASE_URL empty on the sqlite leg makes
    # conftest.py fall back to its own throwaway SQLite file, per usual),
    # but service containers are declared per-job in GitHub Actions, not
    # per-matrix-leg, so it starts on both — a small, accepted overhead
    # rather than splitting this into two separate jobs.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: youthchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379/0
      DATABASE_URL: ${{ matrix.database_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Audit dependencies for known vulnerabilities
        # Real value, not boilerplate: a first real run of this exact
        # command (pip-audit, PyPA's own tool, backed by the PyPI
        # advisory database) found 18 actual CVEs across 7 pinned
        # packages in this file — Flask-Cors CORS-bypass bugs, a
        # python-socketio pickle RCE, several Werkzeug/gunicorn issues —
        # none caught by anything else in this CI pipeline, since a
        # pinned-but-vulnerable version still installs cleanly and still
        # passes every functional test. Runs on both matrix legs
        # (redundant, same accepted trade-off as the Redis/Postgres
        # services above) rather than a separate job, to keep this one
        # simple.
        run: pip-audit -r requirements.txt
      - run: python -m pytest tests/ -v

  blockchain:
    name: Blockchain (Hardhat) — compile & contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blockchain
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Node 22, not 20: found via a real `docker build` failure alongside
      # the Hardhat 2->3 migration, not assumed -- Hardhat 3.12.0
      # hard-requires Node >= 22 and refuses to run at all on 20.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: blockchain/package-lock.json
      - run: npm ci
      # Production-deps-only, mirroring pip-audit's fail-closed posture for
      # the backend. `--omit=dev` matters here specifically: the only known
      # advisory in this tree today is in mocha's own diff/serialize-javascript
      # chain (test tooling only, documented as accepted with no fix
      # available in hardhat.config.js's own comment) -- auditing devDeps too
      # would fail this gate on an already-triaged risk instead of a real one.
      - run: npm audit --omit=dev --audit-level=high
      - run: npx hardhat compile
      - run: npx hardhat test

  mobile:
    name: Mobile (Flutter) — static analysis, tests & release build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: youthchain_app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test
      # Real gap found via a full-codebase review, see docs/mobile-release.md:
      # analyze/test alone never actually attempt a release build, so a
      # release-only compile failure (tree-shaking, a --dart-define typo)
      # had no CI signal at all. Uses the MOBILE_API_BASE_URL repository
      # variable once a real backend domain exists (Settings → Secrets and
      # variables → Actions → Variables); falls back to the same loopback
      # default ApiClient itself uses otherwise, so this step runs
      # meaningfully in every fork/PR, not just after that variable is set.
      - name: Build release APK
        env:
          MOBILE_API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL }}
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="${MOBILE_API_BASE_URL:-http://127.0.0.1:5000}"

  docker:
    name: Backend — Docker image builds & serves a real request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -t youthchain-backend:ci ./backend
      - name: Run container and verify /healthz
        run: |
          docker run -d --name ci-backend -p 5000:5000 \
            -e FLASK_ENV=production \
            -e JWT_SECRET_KEY=ci-test-secret \
            -e ENFORCE_EMAIL_OTP_REG=0 \
            youthchain-backend:ci
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:5000/healthz; then exit 0; fi
            sleep 1
          done
          echo "Container never became healthy:"
          docker logs ci-backend
          exit 1
      - name: Build pg_cron Postgres image and verify the extension actually loads
        # The one place pg_cron itself is verified in CI — the backend
        # job's own Postgres *service* container (below) stays plain
        # postgres:16-alpine (GH Actions services can't build inline from
        # a Dockerfile mid-job), and the scanner's pipeline/claim-queue
        # tests intentionally insert queued scan_run rows directly rather
        # than waiting on a live cron tick (fast, deterministic — see
        # backend/tests/test_scanner_pipeline.py). This is cheap enough
        # to do for real instead: build the image, start it, and confirm
        # CREATE EXTENSION + cron.schedule actually succeed against it.
        run: |
          docker build -t youthchain-postgres-cron:ci ./infra/postgres-cron
          docker run -d --name ci-postgres-cron \
            -e POSTGRES_PASSWORD=ci-test \
            -e POSTGRES_DB=youthchain \
            youthchain-postgres-cron:ci \
            postgres -c shared_preload_libraries=pg_cron -c cron.database_name=youthchain
          for i in $(seq 1 15); do
            if docker exec ci-postgres-cron pg_isready -U postgres > /dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec ci-postgres-cron psql -U postgres -d youthchain -c "CREATE EXTENSION pg_cron;"
          docker exec ci-postgres-cron psql -U postgres -d youthchain -c "SELECT cron.schedule('ci-smoke-test', '*/5 * * * *', \$\$SELECT 1\$\$);"
          docker exec ci-postgres-cron psql -U postgres -d youthchain -c "SELECT jobname FROM cron.job WHERE jobname = 'ci-smoke-test';" | grep -q ci-smoke-test
